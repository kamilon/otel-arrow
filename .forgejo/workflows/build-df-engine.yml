name: Build df-engine image

on:
  push:
    branches:
      - main
      - feature/host-metrics-temperature
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: docker
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y --no-install-recommends docker.io
          rm -rf /var/lib/apt/lists/*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Forgejo registry
        uses: docker/login-action@v3
        with:
          registry: forge.kritonia.com
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and publish df-engine
        uses: docker/build-push-action@v6
        with:
          context: rust/otap-dataflow
          file: rust/otap-dataflow/Dockerfile
          build-contexts: |
            otel-arrow=.
          push: true
          tags: |
            forge.kritonia.com/observability/df-engine:sha-${{ github.sha }}
            forge.kritonia.com/observability/df-engine:latest
